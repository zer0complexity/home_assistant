name: "Reolink Video Library Manager"
description: "Manages FTP-uploaded Reolink videos, generates snapshots, installs its dashboard cards, and purges expired recordings."
version: "0.4.7"
slug: "reolink_video_library_manager"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
boot: auto
startup: application
map:
  - type: homeassistant_config
    read_only: false
    path: /config
  - type: media
    read_only: false
  - type: share
    read_only: false
options:
  watch_directory: "/media/reolink_mirror"
  snapshot_offset: 5
  retention_days: 7
  purge_interval_hours: 24
schema:
  watch_directory: str
  snapshot_offset: "int(0,3600)"
  retention_days: "int(1,3650)"
  purge_interval_hours: "int(1,720)"
